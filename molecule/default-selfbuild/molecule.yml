---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: calibre-web-${MOLECULE_DISTRO:-ubuntu2604}-default-selfbuild
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  # This scenario differs from `default` only in where the container image
  # comes from, so it runs the very same playbooks rather than keeping a copy
  # of them that would drift. The version assertion in the verification is
  # skipped for self-built images, which it detects from the variable below.
  playbooks:
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
    verify: ../default/verify.yml
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        calibre_web_debug_service_enabled: false
        calibre_web_restarts_check_enabled: true

        # Variables for Calibre-Web
        #
        # Deliberately not 1000: the linuxserver.io PUID/PGID pattern has left a
        # needed directory unwritable in other roles of this fleet, and a uid
        # that exists in the test image by accident would hide that.
        calibre_web_uid: 1717
        calibre_web_gid: 1717

        calibre_web_hostname: calibre-web.molecule.local

        calibre_web_path_prefix: /

        # Bound to the loopback interface of the test container only. Nothing
        # is published to the machine running Molecule, so two scenarios can
        # run side by side without fighting over a port.
        calibre_web_container_http_host_bind_port: "127.0.0.1:8083"

        calibre_web_container_http_port: 8083

        calibre_web_container_labels_traefik_enabled: true

        calibre_web_container_labels_additional_labels:
          - mash.molecule.additional-label=set-by-the-role

        calibre_web_container_extra_arguments:
          - "--label=mash.molecule.extra-argument=set-by-the-role"

        # Neither the role's default of Etc/UTC nor the test host's zone, so
        # that the timezone the container ends up in can only have come from
        # templates/env.j2.
        calibre_web_environment_variables_tz: Asia/Tokyo

        # Test self-building
        calibre_web_container_image_self_build: true
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
