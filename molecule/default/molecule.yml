---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: calibre-web-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        calibre_web_debug_service_enabled: false

        # Variables for Calibre-Web
        #
        # The user and the timezone are deliberately not the values the role
        # or the container image would arrive at on their own (1000 and 911
        # respectively for the user, Etc/UTC for the timezone), so that the
        # verification can tell a value that travelled all the way into the
        # running container from one that merely happens to match a default.
        calibre_web_uid: 1042
        calibre_web_gid: 1042
        calibre_web_environment_variables_tz: Europe/Sofia
        calibre_web_scheme: http
        calibre_web_hostname: localhost
        calibre_web_container_labels_traefik_enabled: false
        calibre_web_container_http_host_bind_port: 8083
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
